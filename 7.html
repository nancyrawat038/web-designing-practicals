<html>
<body>
<h2>Validation Form</h2>

<form onsubmit="return check()">
Email: <input type="text" id="e"><br><br>
Phone: <input type="text" id="p"><br><br>
<input type="submit" value="Submit">
</form>

<script>
function check() {
 let e = document.getElementById("e").value;
 let p = document.getElementById("p").value;

 if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e)) {
  alert("Invalid Email");
  return false;
 }
 if (!/^[0-9]{10}$/.test(p)) {
  alert("Enter 10 digits");
  return false;
 }
 alert("Valid Details");
 return true;
}
</script>
</body>
</html>
